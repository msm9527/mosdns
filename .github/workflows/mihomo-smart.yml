name: Release mihomo Smart

on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * *'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  MIHOMO_SMART_TAG: mihomo-smart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test upstream artifact integrity checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/mihomo -p 'test_mirror_smart.py'

      - name: Download and verify original upstream Smart artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/mihomo/mirror-smart.py --output-dir "$RUNNER_TEMP/mihomo-smart"

      - name: Upload verified original files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$MIHOMO_SMART_TAG" = mihomo-smart
          cd "$RUNNER_TEMP/mihomo-smart"
          sha256sum -c SHA256SUMS
          if ! gh release view "$MIHOMO_SMART_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$MIHOMO_SMART_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" --title "$MIHOMO_SMART_TAG" \
              --notes 'Preparing verified upstream Smart artifacts.'
          fi
          gh release upload "$MIHOMO_SMART_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published bytes and retire old patched assets
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const tag = process.env.MIHOMO_SMART_TAG;
            if (tag !== 'mihomo-smart') throw new Error('refuse to update a non-Smart release');
            const directory = path.join(process.env.RUNNER_TEMP, 'mihomo-smart');
            const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'mihomo-smart-source.json'), 'utf8'));
            if (manifest.delivery !== 'upstream-original' || manifest.patched !== false || manifest.recompiled !== false) {
              throw new Error('only original upstream artifacts can be published');
            }
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const filenames = new Set(fs.readdirSync(directory));
            for (const name of filenames) {
              const bytes = fs.readFileSync(path.join(directory, name));
              const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
              const asset = release.assets.find(asset => asset.name === name);
              if (!asset || asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== digest) {
                throw new Error('published asset failed integrity check: ' + name);
              }
            }
            // Remove stale binaries only after every replacement is uploaded
            // and verified. Keep the release URL and its existing identity.
            for (const asset of release.assets) {
              if (!filenames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
            try {
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/' + tag, sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/tags/' + tag, sha: context.sha });
            }
            const body = [
              `同步 [作者发布的 Smart 原版](${manifest.upstream_release_url}) 至 ${manifest.version}。`,
              '',
              '安装包直接复制自 vernesong/mihomo，未修改核心源码、未重新编译、未重新压缩。',
              'Original upstream binaries, copied byte for byte without patches or rebuilding.',
              '',
              '每个平台安装包的 SHA-256 与官方发布元数据一致；下载来源及摘要见 mihomo-smart-source.json 和 SHA256SUMS。',
              '原版不包含 MSM 自定义的 direct-system 回家路由扩展。',
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, name: 'mihomo-smart ' + manifest.version,
              body, draft: false, prerelease: false, make_latest: 'false', target_commitish: context.sha,
            });
            core.notice('Published verified original Smart: ' + manifest.version);
