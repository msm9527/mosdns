name: Release sing-box reF1nd

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sing-box-ref1nd.yml'
      - 'scripts/verify_singbox_runtime.py'
      - 'scripts/singbox/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SINGBOX_SERVER_PATH: /root/dufs/data/sing-box
  SINGBOX_SOURCE_REPOSITORY: reF1nd/sing-box
  SINGBOX_BUILD_TAGS_FILE: release/DEFAULT_BUILD_TAGS_OTHERS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    name: Prepare stable/testing build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      channels: ${{ steps.matrix.outputs.channels }}
    steps:
      - name: Generate build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = 'https://github.com/' + os.environ['SINGBOX_SOURCE_REPOSITORY'] + '.git'
          refs = ['reF1nd-stable', 'reF1nd-testing']
          resolved = subprocess.check_output(['git', 'ls-remote', repository, *['refs/heads/' + ref for ref in refs]], text=True)
          commits = dict(line.split()[::-1] for line in resolved.splitlines())
          subprocess.run(['git', 'init', '-q', 'source-metadata'], check=True)
          subprocess.run(['git', '-C', 'source-metadata', 'remote', 'add', 'origin', repository], check=True)
          subprocess.run(['git', '-C', 'source-metadata', 'fetch', '--quiet', '--filter=blob:none', '--tags',
                          'origin', *commits.values()], check=True)

          def source_metadata(channel):
              commit = commits['refs/heads/' + channel['source_ref']]
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise ValueError('expected immutable source SHA')
              version = subprocess.check_output(['git', '-C', 'source-metadata', 'describe', '--tags', '--always',
                                                  '--match', 'v*', commit], text=True).strip().removeprefix('v')
              if re.fullmatch(r'[0-9a-f]{7,40}', version):
                  version = '0.0.0-reF1nd-' + commit[:12]
              if not re.fullmatch(r'[0-9A-Za-z._+-]+', version):
                  raise ValueError('invalid source version')
              version += '-msm.1'
              return {**channel, 'source_commit': commit, 'source_version': version}

          targets = [
              {"name": "linux-amd64", "goos": "linux", "goarch": "amd64", "goamd64": "v1", "package": "tar.gz", "asset_suffix": "linux-amd64"},
              {"name": "linux-amd64-v3", "goos": "linux", "goarch": "amd64", "goamd64": "v3", "package": "tar.gz", "asset_suffix": "linux-amd64v3"},
              {"name": "linux-armv5", "goos": "linux", "goarch": "arm", "goarm": "5", "package": "tar.gz", "asset_suffix": "linux-armv5"},
              {"name": "linux-armv6", "goos": "linux", "goarch": "arm", "goarm": "6", "package": "tar.gz", "asset_suffix": "linux-armv6"},
              {"name": "linux-armv7", "goos": "linux", "goarch": "arm", "goarm": "7", "package": "tar.gz", "asset_suffix": "linux-armv7"},
              {"name": "linux-arm64", "goos": "linux", "goarch": "arm64", "package": "tar.gz", "asset_suffix": "linux-arm64"},
              {"name": "linux-mips-softfloat", "goos": "linux", "goarch": "mips", "gomips": "softfloat", "package": "tar.gz", "asset_suffix": "linux-mips-softfloat"},
              {"name": "linux-mipsle-softfloat", "goos": "linux", "goarch": "mipsle", "gomips": "softfloat", "package": "tar.gz", "asset_suffix": "linux-mipsle-softfloat"},
              {"name": "linux-mipsle-hardfloat", "goos": "linux", "goarch": "mipsle", "gomips": "hardfloat", "package": "tar.gz", "asset_suffix": "linux-mipsle-hardfloat"},
              {"name": "windows-amd64", "goos": "windows", "goarch": "amd64", "goamd64": "v1", "package": "exe", "asset_suffix": "windows-amd64"},
              {"name": "windows-amd64-v3", "goos": "windows", "goarch": "amd64", "goamd64": "v3", "package": "exe", "asset_suffix": "windows-amd64v3"},
              {"name": "windows-arm64", "goos": "windows", "goarch": "arm64", "package": "exe", "asset_suffix": "windows-arm64"},
              {"name": "darwin-amd64", "goos": "darwin", "goarch": "amd64", "goamd64": "v1", "package": "tar.gz", "asset_suffix": "darwin-amd64"},
              {"name": "darwin-amd64-v3", "goos": "darwin", "goarch": "amd64", "goamd64": "v3", "package": "tar.gz", "asset_suffix": "darwin-amd64v3"},
              {"name": "darwin-arm64", "goos": "darwin", "goarch": "arm64", "package": "tar.gz", "asset_suffix": "darwin-arm64"},
          ]
          channels = [
              {"channel": "stable", "source_ref": "reF1nd-stable", "release_tag": "sing-box-reF1nd", "asset_prefix": "sing-box-reF1nd", "prerelease": False},
              {"channel": "testing", "source_ref": "reF1nd-testing", "release_tag": "sing-box-reF1nd-testing", "asset_prefix": "sing-box-testing-reF1nd", "prerelease": True},
          ]
          channels = [source_metadata(channel) for channel in channels]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('channels=' + json.dumps({'include': channels}, separators=(',', ':')) + '\n')
          print(json.dumps({"include": [{**channel, **target} for channel in channels for target in targets]}, separators=(",", ":")))
          PY
          )"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.channel }} / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout ${{ matrix.source_ref }} source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ matrix.source_commit }}
          fetch-depth: 0

      - name: Checkout MSM runtime gate
        uses: actions/checkout@v6
        with:
          path: msm-build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Apply audited native repairs to exact source and isolated dependency
        shell: bash
        run: |
          set -euo pipefail
          bash msm-build/scripts/singbox/apply-patches.sh

      - name: Verify instance services, cancellation and UDP family isolation
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -json ./experimental/clashapi github.com/sagernet/sing-shadowsocks/... \
            -run '^Test(APIRequestsInheritInstanceServicesAndCancellation|.*UDPNAT|2022SplitSessionConcurrentReplies)' \
            -count=1 | tee native-repair-tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          passed = {event.get('Test') for line in Path('native-repair-tests.jsonl').read_text().splitlines()
                    if (event := json.loads(line)).get('Action') == 'pass'}
          required = {'TestAPIRequestsInheritInstanceServicesAndCancellation', 'TestUDPNATSeparatesDestinationFamilies',
                      'Test2022UDPNATSeparatesDestinationFamilies', 'Test2022SplitSessionConcurrentReplies'}
          assert required <= passed, 'required native regressions were skipped: ' + str(required - passed)
          PY

      - name: Resolve source metadata
        id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_COMMIT"
          echo "version=${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build sing-box
        shell: bash
        env:
          SINGBOX_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(tr ',\n' '  ' < "${SINGBOX_BUILD_TAGS_FILE}" | xargs)"
          ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}' $(cat release/LDFLAGS) -s -w -buildid="
          output='sing-box'
          if [ "${{ matrix.package }}" = "exe" ]; then
            output='sing-box.exe'
          fi
          go build -v -trimpath -ldflags "${ldflags}" -tags "${tags}" -o "${output}" ./cmd/sing-box
          go version -m "${output}" | tee binary-build-info.txt
          test "$(sed -n 's/.*vcs.revision=//p' binary-build-info.txt)" = '${{ matrix.source_commit }}'

      - name: Gate actual Linux baseline runtime before publishing either channel
        if: matrix.name == 'linux-amd64'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          test "$(./sing-box version | sed -n '1p')" = "sing-box version ${EXPECTED_VERSION}"
          python3 msm-build/scripts/verify_singbox_runtime.py ./sing-box --work-dir runtime-gate

      - name: Preserve runtime gate evidence
        if: always() && matrix.name == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: singbox-runtime-gate-${{ matrix.channel }}
          path: |
            runtime-gate/
            native-repair-tests.jsonl
          if-no-files-found: error

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset_name="${{ matrix.asset_prefix }}-${{ matrix.asset_suffix }}"
          if [ "${{ matrix.package }}" = "tar.gz" ]; then
            chmod +x sing-box
            tar --no-same-owner -czf "${asset_name}.tar.gz" sing-box
            echo "asset=${asset_name}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            mv sing-box.exe "${asset_name}.exe"
            echo "asset=${asset_name}.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ./${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish ${{ matrix.channel }} release
    runs-on: ubuntu-latest
    needs: [prepare-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.channels) }}
    steps:
      - name: Checkout mosdns workflow scripts
        uses: actions/checkout@v6

      - name: Resolve source metadata
        id: meta
        shell: bash
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          echo "version=${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${SOURCE_COMMIT:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download ${{ matrix.channel }} artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.asset_prefix }}-*
          path: ./sing-box
          merge-multiple: true

      - name: Show downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh ./sing-box

      - name: Record immutable source and archive checksums
        shell: bash
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          SOURCE_CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('sing-box')
          assets = sorted(directory.iterdir())
          assert len(assets) == 15, 'missing or unexpected release artifacts'
          (directory / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          metadata = {'repository': os.environ['SINGBOX_SOURCE_REPOSITORY'], 'commit': os.environ['SOURCE_COMMIT'],
                      'version': os.environ['SOURCE_VERSION'], 'channel': os.environ['SOURCE_CHANNEL'],
                      'patch_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('scripts/singbox/patches').glob('*.patch'))},
                      'dependencies': {'github.com/sagernet/sing-shadowsocks': 'v0.2.9-0.20260929204512-65740e0f0e3e'},
                      'gates': ['native-check', 'provider', 'shadowsocks-tcp-udp', 'dns-ipv4-ipv6', 'clash-api-instance-context', 'udp-multiple-families', 'reload-restart-cache']}
          (directory / 'source.json').write_text(json.dumps(metadata, indent=2))
          PY

      - name: Delete existing fixed release and tag
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ matrix.release_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            const { owner, repo } = context.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }

      - name: Publish fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_tag }} ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ./sing-box/*
          make_latest: false
          prerelease: ${{ matrix.prerelease }}
          generate_release_notes: false
          body: |
            Version: ${{ steps.meta.outputs.version }}
            Channel: ${{ matrix.channel }}
            Source: https://github.com/${{ env.SINGBOX_SOURCE_REPOSITORY }}/tree/${{ matrix.source_commit }}
            Commit: ${{ steps.meta.outputs.commit }}
            Source commit: ${{ steps.meta.outputs.commit_short }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sshpass and rsync
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Upload ${{ matrix.channel }} binaries to custom server
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT_DIR: ./sing-box
          ARTIFACT_PATTERN: '*'
          DEPLOY_SERVERS: ${{ secrets.DEPLOY_SERVERS }}
          TARGET_PATH_OVERRIDE: ${{ env.SINGBOX_SERVER_PATH }}/${{ matrix.channel }}
          WRITE_VERSION_FILE: 'true'
        run: ./scripts/upload_release_to_server.sh
