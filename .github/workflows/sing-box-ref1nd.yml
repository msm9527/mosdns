name: Release sing-box reF1nd

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sing-box-ref1nd.yml'
      - 'scripts/verify_singbox_runtime.py'
      - 'scripts/singbox/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SINGBOX_SERVER_PATH: /root/dufs/data/sing-box
  SINGBOX_SOURCE_REPOSITORY: reF1nd/sing-box

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    name: Prepare stable/testing build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      channels: ${{ steps.matrix.outputs.channels }}
    steps:
      - name: Generate build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = 'https://github.com/' + os.environ['SINGBOX_SOURCE_REPOSITORY'] + '.git'
          refs = ['reF1nd-stable', 'reF1nd-testing']
          resolved = subprocess.check_output(['git', 'ls-remote', repository, *['refs/heads/' + ref for ref in refs]], text=True)
          commits = dict(line.split()[::-1] for line in resolved.splitlines())
          subprocess.run(['git', 'init', '-q', 'source-metadata'], check=True)
          subprocess.run(['git', '-C', 'source-metadata', 'remote', 'add', 'origin', repository], check=True)
          subprocess.run(['git', '-C', 'source-metadata', 'fetch', '--quiet', '--filter=blob:none', '--tags',
                          'origin', *commits.values()], check=True)

          def source_metadata(channel):
              commit = commits['refs/heads/' + channel['source_ref']]
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise ValueError('expected immutable source SHA')
              version = subprocess.check_output(['git', '-C', 'source-metadata', 'describe', '--tags', '--always',
                                                  '--match', 'v*', commit], text=True).strip().removeprefix('v')
              if re.fullmatch(r'[0-9a-f]{7,40}', version):
                  version = '0.0.0-reF1nd-' + commit[:12]
              if not re.fullmatch(r'[0-9A-Za-z._+-]+', version):
                  raise ValueError('invalid source version')
              return {**channel, 'source_commit': commit, 'source_version': version}

          targets = [
              {"name": "linux-amd64", "goos": "linux", "goarch": "amd64", "goamd64": "v1", "package": "tar.gz", "asset_suffix": "linux-amd64"},
              {"name": "linux-amd64-v3", "goos": "linux", "goarch": "amd64", "goamd64": "v3", "package": "tar.gz", "asset_suffix": "linux-amd64v3"},
              {"name": "linux-armv5", "goos": "linux", "goarch": "arm", "goarm": "5", "package": "tar.gz", "asset_suffix": "linux-armv5"},
              {"name": "linux-armv6", "goos": "linux", "goarch": "arm", "goarm": "6", "package": "tar.gz", "asset_suffix": "linux-armv6"},
              {"name": "linux-armv7", "goos": "linux", "goarch": "arm", "goarm": "7", "package": "tar.gz", "asset_suffix": "linux-armv7"},
              {"name": "linux-arm64", "goos": "linux", "goarch": "arm64", "package": "tar.gz", "asset_suffix": "linux-arm64"},
              {"name": "linux-mips-softfloat", "goos": "linux", "goarch": "mips", "gomips": "softfloat", "package": "tar.gz", "asset_suffix": "linux-mips-softfloat"},
              {"name": "linux-mipsle-softfloat", "goos": "linux", "goarch": "mipsle", "gomips": "softfloat", "package": "tar.gz", "asset_suffix": "linux-mipsle-softfloat"},
              {"name": "linux-mipsle-hardfloat", "goos": "linux", "goarch": "mipsle", "gomips": "hardfloat", "package": "tar.gz", "asset_suffix": "linux-mipsle-hardfloat"},
              {"name": "windows-amd64", "goos": "windows", "goarch": "amd64", "goamd64": "v1", "package": "exe", "asset_suffix": "windows-amd64"},
              {"name": "windows-amd64-v3", "goos": "windows", "goarch": "amd64", "goamd64": "v3", "package": "exe", "asset_suffix": "windows-amd64v3"},
              {"name": "windows-arm64", "goos": "windows", "goarch": "arm64", "package": "exe", "asset_suffix": "windows-arm64"},
              {"name": "darwin-amd64", "goos": "darwin", "goarch": "amd64", "goamd64": "v1", "package": "tar.gz", "asset_suffix": "darwin-amd64"},
              {"name": "darwin-amd64-v3", "goos": "darwin", "goarch": "amd64", "goamd64": "v3", "package": "tar.gz", "asset_suffix": "darwin-amd64v3"},
              {"name": "darwin-arm64", "goos": "darwin", "goarch": "arm64", "package": "tar.gz", "asset_suffix": "darwin-arm64"},
          ]
          channels = [
              {"channel": "stable", "source_ref": "reF1nd-stable", "release_tag": "sing-box-reF1nd", "asset_prefix": "sing-box-reF1nd", "prerelease": False},
              {"channel": "testing", "source_ref": "reF1nd-testing", "release_tag": "sing-box-reF1nd-testing", "asset_prefix": "sing-box-testing-reF1nd", "prerelease": True},
          ]
          channels = [source_metadata(channel) for channel in channels]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('channels=' + json.dumps({'include': channels}, separators=(',', ':')) + '\n')
          print(json.dumps({"include": [{**channel, **target} for channel in channels for target in targets]}, separators=(",", ":")))
          PY
          )"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.channel }} / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    defaults:
      run:
        working-directory: upstream
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout ${{ matrix.source_ref }} source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ matrix.source_commit }}
          path: upstream
          fetch-depth: 0

      - name: Checkout MSM runtime gate
        uses: actions/checkout@v6
        with:
          path: msm-build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: upstream/go.sum

      - name: Resolve source metadata
        id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_COMMIT"
          echo "version=${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build unchanged upstream source and dependencies
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
        run: bash ../msm-build/scripts/singbox/build-upstream.sh "$PWD" "$RUNNER_TEMP/singbox-build"

      - name: Preserve original source build evidence
        uses: actions/upload-artifact@v7
        with:
          name: singbox-build-evidence-${{ matrix.channel }}-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/singbox-build/build.json
            ${{ runner.temp }}/singbox-build/build-info.txt
          if-no-files-found: error

      - name: Gate actual Linux baseline runtime before publishing either channel
        if: matrix.name == 'linux-amd64'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          test "$("$RUNNER_TEMP/singbox-build/sing-box" version | sed -n '1p')" = "sing-box version ${EXPECTED_VERSION}"
          python3 ../msm-build/scripts/verify_singbox_runtime.py "$RUNNER_TEMP/singbox-build/sing-box" --work-dir "$RUNNER_TEMP/runtime-gate"

      - name: Preserve runtime gate evidence
        if: always() && matrix.name == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: singbox-runtime-gate-${{ matrix.channel }}
          path: ${{ runner.temp }}/runtime-gate/
          if-no-files-found: error

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/singbox-build"
          asset_name="${{ matrix.asset_prefix }}-${{ matrix.asset_suffix }}"
          if [ "${{ matrix.package }}" = "tar.gz" ]; then
            chmod +x sing-box
            tar --no-same-owner -czf "${asset_name}.tar.gz" sing-box
            echo "asset=${asset_name}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            mv sing-box.exe "${asset_name}.exe"
            echo "asset=${asset_name}.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ runner.temp }}/singbox-build/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish ${{ matrix.channel }} release
    runs-on: ubuntu-latest
    needs: [prepare-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.channels) }}
    steps:
      - name: Checkout mosdns workflow scripts
        uses: actions/checkout@v6

      - name: Resolve source metadata
        id: meta
        shell: bash
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
        run: |
          set -euo pipefail
          echo "version=${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${SOURCE_COMMIT:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download ${{ matrix.channel }} artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.asset_prefix }}-*
          path: ./sing-box
          merge-multiple: true

      - name: Download original-source build evidence
        uses: actions/download-artifact@v8
        with:
          pattern: singbox-build-evidence-${{ matrix.channel }}-*
          path: ./build-evidence

      - name: Record immutable source and archive checksums
        shell: bash
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          SOURCE_CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('sing-box')
          assets = sorted(directory.iterdir())
          assert len(assets) == 15, 'missing or unexpected release artifacts'
          (directory / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          builds = [json.loads(p.read_text()) for p in sorted(Path('build-evidence').glob('*/build.json'))]
          assert len(builds) == 15, 'missing original-source build evidence'
          for build in builds:
              assert build['commit'] == os.environ['SOURCE_COMMIT']
              assert build['version'] == os.environ['SOURCE_VERSION']
              assert build['patched'] is False and build['source_modified'] is False
          metadata = {'repository': os.environ['SINGBOX_SOURCE_REPOSITORY'], 'commit': os.environ['SOURCE_COMMIT'],
                      'version': os.environ['SOURCE_VERSION'], 'channel': os.environ['SOURCE_CHANNEL'],
                      'delivery': 'unmodified-upstream-source-build', 'patched': False,
                      'dependencies': 'unmodified upstream go.mod and go.sum', 'builds': builds,
                      'gates': ['clean-source', 'module-integrity', 'native-check', 'provider',
                                'shadowsocks-tcp-udp', 'dns-ipv4-ipv6', 'https-delay-process-trust', 'reload-restart-cache'],
                      'patch_regressions_run': False}
          (directory / 'source.json').write_text(json.dumps(metadata, indent=2))
          PY

      - name: Upload verified upstream-source builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          cd sing-box
          sha256sum -c SHA256SUMS
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes 'Preparing builds from unmodified upstream source.'
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published files and update fixed release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ matrix.release_tag }}
          PRERELEASE: ${{ matrix.prerelease }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const tag = process.env.RELEASE_TAG;
            if (!['sing-box-reF1nd', 'sing-box-reF1nd-testing'].includes(tag)) {
              throw new Error('refuse to update unrelated release');
            }
            const directory = 'sing-box';
            const source = JSON.parse(fs.readFileSync(path.join(directory, 'source.json'), 'utf8'));
            if (source.delivery !== 'unmodified-upstream-source-build' || source.patched !== false) {
              throw new Error('only unmodified upstream source builds can be published');
            }
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const filenames = new Set(fs.readdirSync(directory));
            for (const name of filenames) {
              const bytes = fs.readFileSync(path.join(directory, name));
              const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
              const asset = release.assets.find(asset => asset.name === name);
              if (!asset || asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== digest) {
                throw new Error('published asset failed integrity check: ' + name);
              }
            }
            for (const asset of release.assets) {
              if (!filenames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
            try {
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/' + tag, sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/tags/' + tag, sha: context.sha });
            }
            const body = [
              `Version: ${source.version}`,
              `Channel: ${source.channel}`,
              `Source: https://github.com/${source.repository}/tree/${source.commit}`,
              `Commit: ${source.commit}`,
              `Source commit: ${source.commit.slice(0, 12)}`,
              '',
              '使用 reF1nd 作者原始源码编译，核心源码与依赖均未修改，不含 MSM 补丁。',
              'Built from unmodified upstream source and dependencies; no MSM patches.',
              '作者仓库暂无预编译 Release；本发布为原始源码构建，并非复制作者二进制。',
              '',
              '构建来源、Go 构建信息和校验摘要见 source.json 与 SHA256SUMS。',
              '已验证基础订阅、转发、DNS 与重载；历史 MSM 补丁专属回归不属于本发布验证范围。',
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, name: tag + ' ' + source.version, body,
              draft: false, prerelease: process.env.PRERELEASE === 'true', make_latest: 'false',
              target_commitish: context.sha,
            });

      - name: Install sshpass and rsync
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Upload ${{ matrix.channel }} binaries to custom server
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT_DIR: ./sing-box
          ARTIFACT_PATTERN: '*'
          DEPLOY_SERVERS: ${{ secrets.DEPLOY_SERVERS }}
          TARGET_PATH_OVERRIDE: ${{ env.SINGBOX_SERVER_PATH }}/${{ matrix.channel }}
          WRITE_VERSION_FILE: 'true'
        run: ./scripts/upload_release_to_server.sh
