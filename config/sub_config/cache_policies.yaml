# 系统级缓存策略配置
#
# 这个文件是响应缓存与 UDP 快路径缓存的系统基线真源。
# - 它属于 sub_config，不属于用户业务配置。
# - 前端当前不直接改这个文件；需要调整时，修改后重启 mosdns 生效。
# - 不走数据库；数据库只保存运行态统计、日志和其他生成态数据。
# - 缓存开关只控制“是否启用某类缓存”，这里控制“启用后怎么缓存”。
#
# 顶层结构：
# - response: 各类 DNS 响应缓存策略，key 必须是内置缓存插件 tag。
# - udp_fast_path: UDP 极限快路径缓存策略。
#
# response 下每个缓存策略支持：
# - size: 最大缓存条目数；超出后按 LRU 自动淘汰旧条目，不会整库清空。
# - lazy_cache_ttl: 成功响应在后端缓存中最多保留多久，单位秒；0 表示按真实 DNS TTL 保留。
# - lazy_stale_ttl: 真实 TTL 过期后，最多还能返回 stale 结果多久，单位秒；0 表示禁用。
# - client_ttl_min / client_ttl_max: 命中该响应缓存后返回给客户端的 TTL 裁剪范围；
#   0 表示不限制该边界。真实解析默认 120-900 秒，FakeIP 默认固定为 600 秒。
# - nxdomain_ttl / servfail_ttl: 负面结果缓存秒数，用于收敛重复失败查询。
# - l1_enabled: 是否启用进程内 L1 热缓存。
# - l1_total_cap / l1_shard_cap: L1 热缓存容量上限；不设 shard 时按实现自动分配。
# - bypass_domain_sets: 命中这些域名集时完全绕过该响应缓存，不读 L1/L2，也不写入。
# - persist: 是否启用 dump + WAL 持久化。
# - dump_file: 周期性快照文件路径。
# - dump_interval: 多久写一次快照，单位秒。
# - wal_file: 可选，自定义 WAL 文件路径；不写则按 dump_file 自动推导。
# - wal_sync_interval: WAL flush/fsync 周期，单位秒；越小越安全，磁盘写入越频繁。
#
# 内置缓存 tag 说明：
# - cache_main: 真实解析主缓存，跨国内/国外真实链共享。
# - cache_branch_domestic: 国内真实解析分支缓存。
# - cache_branch_foreign: 国外真实解析分支缓存。
# - cache_branch_foreign_ecs: 兼容旧配置保留的国外 ECS 分支缓存，新链路不再直接使用。
# - cache_fakeip_domestic: 国内 fakeip 响应缓存。
# - cache_fakeip_proxy: 代理 fakeip 响应缓存。
# - cache_probe: 节点探测专用缓存。
#
# 设计默认值：
# - fakeip 缓存默认不持久化，后端保留 2 小时并向客户端稳定返回 600s TTL，
#   避免命中缓存后 TTL 衰减到 1s 导致局域网客户端持续重查。
# - probe 缓存默认不持久化，避免跨重启保留旧探测结果。
# - 真实解析缓存采用 stale-while-revalidate：后端保留期内优先返回缓存并后台刷新。
# - 这样查询过的普通域名不会在保留期内退回冷查询，DDNS/高变化域名通过绕过名单保证时效。
# - DDNS 域名默认完全不走响应缓存，避免短 TTL / 高变化域名被旧记录拖住。
# - UDP 快路径默认保留热点结果，并允许 FakeIP / 热点缓存向客户端返回更长 TTL。
# - `size` 是“条目上限”不是“文件大小上限”；dump/wal 文件会随实际内容周期更新。
# - 真实解析以 cache_main 作为长期持久化真源；分支缓存只保留小型短期去抖，
#   避免同一真实响应在主缓存和分支缓存中长期重复占用内存与 WAL。
#
# udp_fast_path 字段说明：
# - internal_ttl: 快路径内部缓存保留秒数；只影响服务端热点缓存寿命。
# - stale_retry_seconds: 过期条目进入 stale 刷新后，最短多久允许再次强制重试刷新。
# - stale_max_seconds: 过期后最多允许返回 stale 结果多久；超过后强制回落完整解析。
# - ttl_min / ttl_max: 返回给客户端的 TTL 裁剪范围；0 表示不限制该边界。
# - bypass_domain_sets: 命中这些域名集时完全绕过 UDP 快路径缓存。
# - memory_budget_mb: 快路径表自动容量预算；0 表示按 Go 内存限制推断。
# - response_slots / rule_slots: 手动固定快路径响应/规则槽位；0 表示自动。

response:
  cache_main:
    size: 400000
    lazy_cache_ttl: 43200
    lazy_stale_ttl: 43200
    client_ttl_min: 120
    client_ttl_max: 900
    nxdomain_ttl: 300
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 8192
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: true
    dump_file: db/cache/cache_main.dump
    dump_interval: 3600
    wal_sync_interval: 1

  cache_branch_domestic:
    size: 30000
    lazy_cache_ttl: 900
    lazy_stale_ttl: 900
    client_ttl_min: 120
    client_ttl_max: 900
    nxdomain_ttl: 180
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 1024
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

  cache_branch_foreign:
    size: 30000
    lazy_cache_ttl: 900
    lazy_stale_ttl: 900
    client_ttl_min: 120
    client_ttl_max: 900
    nxdomain_ttl: 180
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 1024
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

  cache_branch_foreign_ecs:
    size: 10000
    lazy_cache_ttl: 900
    lazy_stale_ttl: 900
    client_ttl_min: 120
    client_ttl_max: 900
    nxdomain_ttl: 120
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 512
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

  cache_fakeip_domestic:
    size: 100000
    lazy_cache_ttl: 7200
    lazy_stale_ttl: 7200
    client_ttl_min: 600
    client_ttl_max: 600
    nxdomain_ttl: 60
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 2048
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

  cache_fakeip_proxy:
    size: 120000
    lazy_cache_ttl: 7200
    lazy_stale_ttl: 7200
    client_ttl_min: 600
    client_ttl_max: 600
    nxdomain_ttl: 60
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 2048
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

  cache_probe:
    size: 80000
    lazy_cache_ttl: 600
    lazy_stale_ttl: 600
    client_ttl_min: 120
    client_ttl_max: 900
    nxdomain_ttl: 60
    servfail_ttl: 5
    l1_enabled: true
    l1_total_cap: 2048
    bypass_domain_sets:
      - DDNS域名
      - 高变化域名
    persist: false

udp_fast_path:
  internal_ttl: 3600
  stale_retry_seconds: 30
  stale_max_seconds: 3600
  ttl_min: 120
  ttl_max: 900
  memory_budget_mb: 8
  response_slots: 0
  rule_slots: 0
  bypass_domain_sets:
    - DDNS域名
    - 高变化域名
