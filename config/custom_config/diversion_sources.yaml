# 用户自定义在线分流规则源
#
# 这是“在线分流”入口的长期配置真源。
# - 前端规则管理页保存后会直接改这个文件，并立即热重载相关 provider。
# - 你也可以手工修改这个文件，然后重启 mosdns 生效。
# - 数据库只保留运行态元数据，例如 rule_count / last_updated / last_error。
# - 原始规则文件建议保留在 config/diversion/ 目录；这里不再保存运行态统计。
#
# 字段说明：
# - id: 规则源唯一标识，只用于识别单条 source。
# - name: Web UI 显示名称。
# - bind_to: 绑定到哪个系统分流入口；同一个 bind_to 下可以同时挂多个 source，运行时会自动聚合。
# - enabled: 是否启用该规则源。
# - behavior: 规则语义，允许 domain / ipcidr。
# - match_mode: 允许 domain_set / ip_cidr_set。
# - format: 原始文件格式，例如 list / txt / json / yaml / srs / mrs。
# - source_kind: local / remote。
# - path: 原始文件相对 config 根目录的路径，建议放在 diversion/ 目录下。
# - url: 仅 remote 源需要填写。
# - auto_update / update_interval_hours: 仅 remote 源有效。
#
# 补充入口说明：
# - cuscn: 直连补充，适合放“非 .cn 但在国内应真实解析/直连”的域名。
# - cusnocn: 代理补充，适合放“.cn 或中国站点外观但应继续走代理/FakeIP”的域名。
# - auto_confirm_direct: 自动判定后由用户确认的长期直连域名。
# - auto_confirm_proxy: 自动判定后由用户确认的长期代理/FakeIP 域名。
# - 默认启用 geolocation-cn.txt 作为“全球品牌国内站点”等直连补充。
# - geolocation-!cn.txt 默认关闭；主国外分流已由 geosite_no_cn.srs 承担，
#   需要额外代理补充时可在规则管理页手动启用。

sources:
    - id: cuscn_loyalsoldier
      name: 国内加速补充
      bind_to: cuscn
      enabled: true
      behavior: domain
      match_mode: domain_set
      format: list
      source_kind: remote
      path: diversion/geolocation-cn.list
      url: https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/geolocation-cn.txt
      auto_update: true
      update_interval_hours: 24
    - id: cusnocn_loyalsoldier
      name: 国外专属补充
      bind_to: cusnocn
      enabled: false
      behavior: domain
      match_mode: domain_set
      format: list
      source_kind: remote
      path: diversion/geolocation-not-cn.list
      url: https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/geolocation-!cn.txt
      auto_update: false
      update_interval_hours: 24
    - id: auto_confirm_direct_local
      name: 自动确认直连
      bind_to: auto_confirm_direct
      enabled: true
      behavior: domain
      match_mode: domain_set
      format: list
      source_kind: local
      path: diversion/auto_confirm_direct.list
    - id: auto_confirm_proxy_local
      name: 自动确认代理
      bind_to: auto_confirm_proxy
      enabled: true
      behavior: domain
      match_mode: domain_set
      format: list
      source_kind: local
      path: diversion/auto_confirm_proxy.list
    - id: geoip_cn
      name: 国内 IP 集
      bind_to: geoip_cn
      enabled: true
      behavior: ipcidr
      match_mode: ip_cidr_set
      format: srs
      source_kind: remote
      path: diversion/geoip-cn.srs
      url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/sing/geo/geoip/cn.srs
      update_interval_hours: 24
    - id: geosite_cn
      name: 国内域名集
      bind_to: geosite_cn
      enabled: true
      behavior: domain
      match_mode: domain_set
      format: srs
      source_kind: remote
      path: diversion/geosite-cn.srs
      url: https://github.com/MetaCubeX/meta-rules-dat/raw/sing/geo/geosite/cn.srs
      update_interval_hours: 24
    - id: geosite_no_cn
      name: 非国内域名集
      bind_to: geosite_no_cn
      enabled: true
      behavior: domain
      match_mode: domain_set
      format: srs
      source_kind: remote
      path: diversion/geolocation-!cn.srs
      url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/sing/geo/geosite/geolocation-!cn.srs
